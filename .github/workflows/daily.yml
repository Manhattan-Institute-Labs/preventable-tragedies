name: Daily update

on:
  schedule:
    - cron: "30 10 * * *"  # 10:30 UTC = 6:30am ET (EDT); resumed 2026-09-08, capped at 150 articles
  workflow_dispatch:
    inputs:
      days_back:
        description: "Days of news to search (default 1)"
        default: "1"
      max_classify:
        description: "Cap on articles fetched and classified this run (0 = no cap)"
        default: "150"

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: database
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: database/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAYS_BACK: ${{ inputs.days_back || '1' }}
          MAX_CLASSIFY: ${{ inputs.max_classify || '150' }}
          PYTHONUNBUFFERED: "1"
        run: python pipeline/run_daily.py

      - name: Find mug shots for new stories
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python pipeline/mugshots.py

      - name: Search for second sources on new stories
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python pipeline/corroborate.py --limit 200 --max-minutes 30

      - name: Remove stories the search left single-sourced
        if: always()
        run: python pipeline/enforce_sources.py

      # The serious-mental-illness tracker (smi/): the last day of news,
      # repeat-offender stories with mental-health language, Claude coding,
      # incidents, second-source search. Its requirements match database/'s.
      # Its incidents are records in the "smi" category only (records.py), so
      # categorize.py below does not touch them. A separate step, so a failure
      # in one harvester never stops the other.
      - name: Serious-mental-illness tracker
        if: always()
        working-directory: smi
        timeout-minutes: 90
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python pipeline/run.py daily --max-minutes 60

      - name: Categorize new stories
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python pipeline/categorize.py --max-minutes 20

      - name: Upload decision log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decisions-${{ github.run_id }}
          path: |
            database/data/decisions/
            smi/data/decisions/
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit updated data and exports
        # always(): a run killed by the timeout still commits its checkpoints.
        # SMI data that fails validation is discarded, not committed, and
        # does not hold up this database's update.
        if: always()
        run: |
          git config user.name "preventable-tragedies-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -- exports || true
          git pull --rebase --autostash origin main
          bash pipeline/check_data.sh   # validate both harvesters' data; quarantine or discard
          python pipeline/build_exports.py
          python pipeline/pack_decisions.py
          git add data exports ../smi/data
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push
