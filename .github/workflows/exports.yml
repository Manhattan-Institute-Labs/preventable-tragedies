name: Rebuild exports

# Rebuild exports from existing data. No fetching, no classification. Runs
# on pushes that change export code or the data (hand edits reach exports/
# without waiting for the next cron), and on demand.

on:
  push:
    branches: [main]
    paths:
      - "database/pipeline/build_exports.py"
      - "database/data/**"
      - "smi/data/incidents.csv"
      - "smi/data/removed_incidents.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: database
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: database/requirements.txt
      - run: pip install -r requirements.txt
      - name: Build exports
        run: |
          python pipeline/validate_data.py || { python pipeline/quarantine.py && python pipeline/validate_data.py; }
          python pipeline/build_exports.py
      - name: Commit rebuilt exports
        run: |
          git config user.name "preventable-tragedies-bot"
          git config user.email "actions@users.noreply.github.com"
          git add exports data/offenders.csv
          git diff --cached --quiet || git commit -m "Rebuild exports"
          git pull --rebase --autostash origin main
          git push
