name: Second-source search (manual)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Rows per file to search (0 = all that need it)"
        default: "0"
      recheck:
        description: "Search again for rows already checked"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  corroborate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: database
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: database/requirements.txt
      - run: pip install -r requirements.txt
      - name: Search
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python pipeline/corroborate.py --limit "${{ inputs.limit || '0' }}" --max-minutes 280 ${{ inputs.recheck && '--recheck' || '' }}
      - name: Remove stories the search left single-sourced
        if: always()
        run: python pipeline/enforce_sources.py
      - name: Commit
        if: always()
        run: |
          git config user.name "preventable-tragedies-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -- exports || true
          git pull --rebase --autostash origin main
          bash pipeline/check_data.sh   # validate both harvesters' data; quarantine or discard
          python pipeline/build_exports.py
          git add data exports ../smi/data
          git diff --cached --quiet || git commit -m "Second-source search $(date -u +%F)"
          git push
